[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-sdk"
version = "0.1.0"
description = "Python SDK and CLI for the Mycelium pheromone platform"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
mycelium = "mycelium_sdk.cli:app"

[project.urls]
Homepage = "https://github.com/zenithClaw/mycelium-core"
